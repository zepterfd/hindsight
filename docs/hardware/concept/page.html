<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindsight Deck — concept render</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #15181d; color: #e8e6e1; font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lab { position: absolute; transform: translate(-50%, -120%); max-width: 210px; padding: 6px 9px; border-radius: 8px; background: rgba(12,14,18,.82); border: 1px solid #3a4049; font-size: 12px; display: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; pointer-events: none; background: linear-gradient(#15181dcc, #15181d00); }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .02em; }
  p.sub { margin: 2px 0 0; color: #9aa3b2; font-size: 12.5px; max-width: 46ch; }
  nav { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: calc(100% - 24px); }
  button { appearance: none; border: 1px solid #3a4049; background: #1d2128e6; color: #e8e6e1; padding: 9px 13px; border-radius: 10px; font: inherit; font-size: 13px; min-height: 40px; cursor: pointer; }
  button:hover { border-color: #b98a5a; }
  button[aria-pressed="true"] { background: #b98a5a; color: #1a1206; border-color: #b98a5a; }
  .note { position: fixed; right: 12px; top: 12px; color: #6e7787; font-size: 11.5px; text-align: right; max-width: 24ch; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="3D concept render of the Hindsight Deck: a screen, four channel strips, a scrub ring and a KEEP button"></canvas>
<div id="labels"></div>
<header>
  <h1>Hindsight Deck</h1>
  <p class="sub">A concept: a multitrack's strips, a loop station's pads, and the Hindsight screen, on a Raspberry Pi. Drag to orbit, scroll to zoom.</p>
</header>
<div class="note">Concept render. Not a product, not to scale, nothing here is built.</div>
<nav>
  <button data-view="hero">3/4</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="back">Back</button>
  <button id="lab" aria-pressed="false">Labels</button><button id="spin" aria-pressed="false">Spin</button>
</nav>
<script>/*SCENE*/</script>
<script>
  const api = () => window.__hindsightDeck;
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => api().view(b.dataset.view)));
  for (const [id, fn] of [['lab', 'labels'], ['spin', 'spin']]) {
    const b = document.getElementById(id);
    b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); api()[fn](on); });
  }
</script>
</body>
</html>
